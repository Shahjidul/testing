<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded Store</title>
    <link rel="icon" href="zz.PNG">
    <link rel="stylesheet" href="style.css">
    
</head>

<body>
    <nav>
        <span class="logo">Embedded<br>Store</span>

        <div class="nav-links">
            <a href="Home.html">Home</a>
            <a href="About.html">About Us</a>
            <a href="Contact.html">Contact Us</a>
            <a href="Cart.html">Cart</a>
        </div>

        <button class="login-btn">Log in/Sign Up</button>
    </nav>

    <div class="container">
    <div class="card">
        <img src="Pics of/14-pin-dip.jpg" alt="14-pin-dip">
        <div class="card-content">
            <h3>14-pin-dip</h3>
            <p class="price">100 BDT</p>
            <button class="add-btn">Add to Cart</button>
        </div>
    </div>

    <div class="card">
        <img src="Pics of/arduino-nano-r3.jpg" >
        <div class="card-content">
            <h3>Arduino Nano R3</h3>
            <p class="price">500 BDT</p>
            <button class="add-btn">Add to Cart</button>
        </div>
    </div>
     <div class="card">
        <img src="Pics of/arduino-uno-r3.jpg" >
        <div class="card-content">
            <h3>Arduino Uno R3</h3>
            <p class="price">950 BDT</p>
            <button class="add-btn">Add to Cart</button>
        </div>
    </div>
     <div class="card">
        <img src="Pics of/arduino-zero-original.jpg" >
        <div class="card-content">
            <h3>Arduino Zero Original</h3>
            <p class="price">9900 BDT</p>
            <button class="add-btn">Add to Cart</button>
        </div>
    </div>
     <div class="card">
        <img src="Pics of/dfrduino-m0-mainboard-arduino-compatible.jpg" >
        <div class="card-content">
            <h3>DFRDUINO M0 Mainboard</h3>
            <p class="price">1950 BDT</p>
            <button class="add-btn">Add to Cart</button>
        </div>
    </div>
     <div class="card">
        <img src="Pics of/dip-switch-8-position.jpg" >
        <div class="card-content">
            <h3>Dip Switch</h3>
            <p class="price">20 BDT</p>
            <button class="add-btn">Add to Cart</button>
        </div>
    </div>

</html>
